<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro — Lens Studio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">📷 LENS STUDIO</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container" style="max-width:550px;">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Únete a nuestra plataforma de gestión fotográfica</p>

        <form action="login.html" method="GET">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo de usuario</label>
                    <select id="tipo" required>
                        <option value="">Selecciona...</option>
                        <option value="cliente">Cliente</option>
                        <option value="fotografo">Fotógrafo</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" placeholder="+52 555 000 0000" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="password2">Confirmar contraseña</label>
                    <input type="password" id="password2" required>
                </div>
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:flex-start; gap:0.5rem; margin:0;">
                    <input type="checkbox" style="width:auto; margin-top:4px;" required>
                    <span style="font-size:0.85rem;">Acepto los términos y condiciones de uso.</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Registrarme</button>
        </form>

        <p class="form-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </div>

</body>
</html>
