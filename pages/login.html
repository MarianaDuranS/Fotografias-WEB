<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión — Lens Studio</title>
    <link rel="stylesheet" href="css/stylesFoto.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">📷 LENS STUDIO</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="./registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Accede a tu panel de gestión fotográfica</p>

        <form action="./panel.html" method="GET">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
                <label style="display:flex; align-items:center; gap:0.5rem; margin:0;">
                    <input type="checkbox" style="width:auto;"> Recordarme
                </label>
                <a href="./recuperar.html" style="font-size:0.85rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
        </form>

        <p class="form-footer">
            ¿No tienes cuenta? <a href="./registro.html">Regístrate aquí</a>
        </p>
    </div>

</body>
</html>
