<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar acceso — Lens Studio</title>
    <link rel="stylesheet" href="css/stylesFoto.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">📷 LENS STUDIO</div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h2>Recuperar acceso</h2>
        <p class="subtitle">Ingresa tu correo y te enviaremos las instrucciones</p>

        <form action="login.html" method="GET">
            <div class="form-group">
                <label for="email">Correo electrónico registrado</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="opcion">¿Qué deseas recuperar?</label>
                <select id="opcion" required>
                    <option value="ambos">Usuario y contraseña</option>
                    <option value="usuario">Solo usuario</option>
                    <option value="password">Solo contraseña</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Enviar instrucciones</button>
        </form>

        <p class="form-footer">
            ¿Recordaste tu contraseña? <a href="./login.html">Volver al login</a>
        </p>
    </div>

</body>
</html>
